<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aimable Iradukunda (Tyrah) - Profile</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
        }
        img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="mypicture.jpg" alt="Aimable Iradukunda">
        <h1>Aimable Iradukunda</h1>
        <p><strong>Hobbies:</strong>music and movies, designing, coding.</p>
        <p><strong>Contact:</strong> aimableiradukunda44@gmail.com</p>

        <div class="btn-group">
            <button onclick="showMessage()">My Profile</button>
            <button onclick="changeBg()">Change Background</button>
        </div>
    </div>

    <script>
        function showMessage() {
            alert("Welcome to my profile!");
        }
        function changeBg() {
            const colors = ["#f4f4f9", "#e0f7fa", "#ffecb3", "#dcedc8"];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            document.body.style.backgroundColor = randomColor;
        }
    </script>
</body>
</html>
